name: CourtVision Daily Pipeline & Auto-Grader

on:
  schedule:
    # 8:00 AM EST (13:00 UTC) - Morning Auto-Grader & Settlement
    - cron: '0 13 * * *'
    # 4:00 PM EST (21:00 UTC) - Afternoon Odds Ingestion, Quant Modeling, Gemini Veto & Staking
    - cron: '0 21 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write
  pages: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute CourtVision Pipeline
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python update_model.py

      - name: Commit & Push Updated Data to GitHub Pages
        run: |
          git config --local user.email "courtvision-bot@users.noreply.github.com"
          git config --local user.name "CourtVision Auto-Bot"
          git add data/ docs/ index.html app.js courtvision_data.js
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated update: Bankroll ledger & daily predictions [skip ci]"
            git push
          fi
